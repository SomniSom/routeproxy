listen: "127.0.0.1:1080"
generated_path: generated/config.json
cache_dir: generated/cache

proxies:
  - name: vless-grpc
    purpose: [auto, telegram]
    type: vless
    server: example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    tls:
      server_name: sni.example
      reality: true
      public_key: pk
      short_id: abcd
      utls: firefox
    transport:
      type: grpc
      service_name: livestreamcontent

dns:
  direct_names:
    - example.com

routing:
  ru: direct
